// Optional MKS integration for SystemHeat. MKS modules remain intact so their
// dynamic swappable bays and drillheads continue to work.

@PART[MKS_*|ATLAS_*|Duna_*|Tundra_*|Ranger_*]:HAS[@MODULE[USI_Converter]]:FINAL
{
  !MODULE[ModuleCoreHeat] {}
  !MODULE[ModuleOverheatDisplay] {}
  MODULE
  {
    name = ModuleSystemHeat
    volume = 10
    moduleID = mks
    iconName = Icon_Gears
  }
  MODULE
  {
    name = ModuleSystemHeatUSIConverter
    moduleID = mksConverter
    systemHeatModuleID = mks
    heatMultiplier = 0.9
    systemOutletTemperature = 600
  }
}

@PART[MKS_*|ATLAS_*|Duna_*|Tundra_*|Ranger_*]:HAS[@MODULE[USI_Harvester]]:FINAL
{
  !MODULE[ModuleCoreHeat] {}
  !MODULE[ModuleOverheatDisplay] {}
  MODULE
  {
    name = ModuleSystemHeat
    volume = 10
    moduleID = mks
    iconName = Icon_Drill
  }
  MODULE
  {
    name = ModuleSystemHeatUSIHarvester
    moduleID = mksHarvester
    systemHeatModuleID = mks
    heatMultiplier = 1
    systemOutletTemperature = 350
  }
}

@PART[MKS_*|ATLAS_*|Duna_*|Tundra_*|Ranger_*]:HAS[@MODULE[ModuleHeatPump]]:FINAL
{
  MODULE
  {
    name = ModuleSystemHeat
    volume = 10
    moduleID = mks
    iconName = Icon_Radiator
  }
  MODULE
  {
    name = ModuleSystemHeatUSIHeatPump
    moduleID = mksHeatPump
    systemHeatModuleID = mks
  }
}
