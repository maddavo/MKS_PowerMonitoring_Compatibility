// MKS Power Monitoring Compatibility
// Adds MKS USI_Converter modules to Dynamic Battery Storage's Systems Monitor.
// This is intentionally a separate Module Manager patch: it does not modify
// MKS or Dynamic Battery Storage files.

@DYNAMICBATTERYSTORAGE:NEEDS[DynamicBatteryStorage&000_USITools]
{
	@HANDLERCATEGORY[Converters]
	{
		module = USI_Converter
	}

	PARTMODULEHANDLER
	{
		name = USI_Converter
		handlerModuleName = ModuleResourceConverterPowerHandler
		type = Power
		visible = true
		solarEfficiencyEffects = false
		producer = false
		consumer = true
		simulated = true
		continuous = true
	}
}
